[project]
name = "runsense-strava-langchain"
version = "1.0.0"
description = "Standalone read-only Strava tools for RunSense, LangChain, and Postman"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain>=0.3,<0.4",
  "langchain-anthropic>=0.3,<0.4",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
